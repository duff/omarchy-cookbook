# The always-on machine's one Samba share: where the ScanSnap saves scans.
# scan-upload.service moves them on to Dropbox. apply.sh fills in @USER@ and
# @LAN@ and installs this as /etc/samba/smb.conf.
[global]
   server role = standalone server
   server string = scans
   # The scanner is on the home network. Nothing else gets in.
   hosts allow = @LAN@ 127.0.0.1
   map to guest = never
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   logging = systemd

[scans]
   path = /home/@USER@/Scans
   valid users = scansnap
   # The scanner signs in as "scansnap", but files land owned by you so the
   # upload service can move them.
   force user = @USER@
   force group = @USER@
   read only = no
   create mask = 0644
   directory mask = 0755
   # A Mac's metadata files would keep ~/Scans from ever being empty.
   veto files = /.DS_Store/._*/
   delete veto files = yes
